name: Build Jaago Alarm APK

on:
  push:
    branches:
      - main
      - 'ccr-**'
    paths:
      - 'alarm-app/**'
      - '.github/workflows/alarm-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: alarm-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: alarm-app
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Jaago-Alarm-debug.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jaago-Alarm-APK
          path: alarm-app/out/Jaago-Alarm-debug.apk
          if-no-files-found: error
          retention-days: 30
