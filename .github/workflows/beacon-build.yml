name: Build Beacon APK

on:
  push:
    paths:
      - 'beacon/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/beacon-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      # Only the :beacon module. The unrelated :app module in this repo pulls large
      # native dependencies that have nothing to do with this build.
      - name: Run unit tests
        run: gradle :beacon:testLanDebugUnitTest

      # The lan flavor needs no google-services.json, so it is the one CI can prove.
      - name: Build debug APK
        run: gradle :beacon:assembleLanDebug

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beacon-test-report
          path: beacon/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beacon-debug-apk
          path: beacon/build/outputs/apk/lan/debug/beacon-lan-debug.apk

      # Artifacts can only be downloaded from a logged-in desktop browser, which is the wrong
      # place when you want the app on a phone. A release gives a plain public link that any
      # phone browser can open.
      - name: Publish to the "beacon-latest" release
        if: github.ref_name == 'claude/android-bypass-silent-mode-990lcw'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp beacon/build/outputs/apk/lan/debug/beacon-lan-debug.apk beacon.apk
          gh release delete beacon-latest --yes --cleanup-tag || true
          gh release create beacon-latest beacon.apk \
            --title "Beacon (latest build)" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Newest test build of the Beacon app.

          Download **beacon.apk** below and install it on your phone.

          This is the \`lan\` build: it rings phones on the same Wi-Fi with no setup at all.
          To ring phones anywhere, see beacon/README.md."
