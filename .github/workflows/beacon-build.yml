name: Build Beacon APK

on:
  push:
    paths:
      - 'beacon/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/beacon-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets cannot be used directly in an `if:`, so the presence check is hoisted into a
      # plain string here and the Firebase steps test that instead.
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      # Written before any Gradle run, because the build decides whether to apply the Firebase
      # plugin by looking for this file at configuration time.
      - name: Add Firebase config (only if the secret is set)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > beacon/google-services.json

      # Only the :beacon module. The unrelated :app module in this repo pulls large
      # native dependencies that have nothing to do with this build.
      - name: Run unit tests
        run: gradle :beacon:testLanDebugUnitTest

      # The lan flavor needs no google-services.json, so it always builds.
      - name: Build the Wi-Fi app
        run: gradle :beacon:assembleLanDebug

      # The cloud flavor needs the owner's Firebase config, so it is built only when one was
      # supplied. Nothing here fails a repository that has not set it up.
      - name: Build the anywhere app
        if: env.HAS_FIREBASE == 'true'
        run: gradle :beacon:assembleCloudDebug

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beacon-test-report
          path: beacon/build/reports/tests/

      # A release gives a plain public link any phone browser can open. Workflow artifacts
      # can only be downloaded from a logged-in desktop browser, which is the wrong place
      # when the goal is installing on a phone.
      - name: Publish to the "beacon-latest" release
        if: github.ref_name == 'claude/android-bypass-silent-mode-990lcw'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One app on the download page, never two. Which one depends on whether the
          # Firebase secret has been added yet.
          if [ -f beacon/build/outputs/apk/cloud/debug/beacon-cloud-debug.apk ]; then
            cp beacon/build/outputs/apk/cloud/debug/beacon-cloud-debug.apk beacon.apk
            NOTES="Install **beacon.apk** on every phone you want to find.

          Then on each phone: create or join a circle with the same code, and paste your relay address into **Distant phones > Change**.

          Rings your phones from anywhere, through silent mode and Do Not Disturb."
          else
            cp beacon/build/outputs/apk/lan/debug/beacon-lan-debug.apk beacon.apk
            NOTES="Install **beacon.apk** on every phone you want to find.

          > **This build only rings phones on the same Wi-Fi.** To ring them from anywhere, follow [SETUP.md](https://github.com/Amrit4949/Amrit_IAS/blob/${GITHUB_REF_NAME}/beacon/SETUP.md). Once you have added the Firebase secret, this page will automatically switch to the full version.

          Rings your phones through silent mode and Do Not Disturb."
          fi

          gh release delete beacon-latest --yes --cleanup-tag || true
          gh release create beacon-latest beacon.apk \
            --title "Beacon (latest build)" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "$NOTES

          Android will warn that this is from an unknown source, because it did not come from the Play Store. That is expected for an app you built yourself."
