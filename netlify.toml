# Publishes the Earshot web player. There is no build step — web/earshot.html
# is a single self-contained file — so the whole "web" folder is served as-is
# and the root path rewrites to it. The Android app is built by GitHub Actions.
[build]
  publish = "web"

[[redirects]]
  from = "/"
  to = "/earshot.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
